server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: etudiant-service
          uri: lb://etudiant-service
          predicates:
            - Path=/api/etudiants/**
        - id: grading-service
          uri: lb://grading-service
          predicates:
            - Path=/api/notes/**
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
